version: "2"

linters:
  # dupl flags copied blocks before they drift. Threshold is in tokens: the
  # lowest that passes on today's tree; lower it as copies are removed.
  # errorlint: an error type assertion or == misses a wrapped error.
  # funlen, cyclop, and revive hold the size, branch, and nesting numbers
  # skills/engineering-fundamentals/reference/metric-thresholds.md owns;
  # go/e2e TestLintMatchesTheThresholds keeps them equal.
  enable: [dupl, errorlint, funlen, cyclop, revive]
  settings:
    dupl:
      threshold: 32
    errcheck:
      # Output and cleanup: a failed write to stdout or a failed close has no
      # recovery here, and hooks fail open by design.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - (io.Closer).Close
        - os.Remove
    funlen:
      lines: 50
      statements: -1
      ignore-comments: true
    cyclop:
      max-complexity: 15
    revive:
      rules:
        - name: max-control-nesting
          arguments: [3]
        - name: file-length-limit
          arguments:
            - max: 500
  exclusions:
    rules:
      # Test setup ignores errors on purpose; a failed step fails the assertion after it.
      - path: _test\.go
        linters: [errcheck]
      # Table-driven tests repeat their shape on purpose.
      - path: _test\.go
        linters: [dupl]
      # A test's length is its cases.
      - path: _test\.go
        linters: [funlen, cyclop, revive]
      # Ratchet: each file below breached a threshold when the linters came
      # in. A change that brings one under deletes its entry; none is added.
      - path: ^cmd/kit/hook\.go$
        linters: [funlen]
      - path: ^internal/adr/adr\.go$
        linters: [cyclop]
      - path: ^internal/claims/claims\.go$
        linters: [cyclop, funlen, revive]
      - path: ^internal/classify/classify\.go$
        linters: [cyclop, revive]
      - path: ^internal/codegraph/codegraph\.go$
        linters: [cyclop]
      - path: ^internal/codegraph/coupling\.go$
        linters: [cyclop, funlen]
      - path: ^internal/codegraph/graph\.go$
        linters: [cyclop]
      - path: ^internal/codegraph/importers\.go$
        linters: [cyclop]
      - path: ^internal/codegraph/manifests\.go$
        linters: [cyclop, funlen]
      - path: ^internal/config/config\.go$
        linters: [revive]
      - path: ^internal/config/load\.go$
        linters: [cyclop, funlen, revive]
      - path: ^internal/config/options\.go$
        linters: [cyclop, funlen]
      - path: ^internal/design/tokens\.go$
        linters: [cyclop]
      - path: ^internal/enforce/enforce\.go$
        linters: [revive]
      - path: ^internal/enforce/expand\.go$
        linters: [cyclop]
      - path: ^internal/explain/explain\.go$
        linters: [cyclop, funlen]
      - path: ^internal/gapfill/gapfill\.go$
        linters: [cyclop, funlen]
      - path: ^internal/gapfill/verify\.go$
        linters: [cyclop, funlen, revive]
      - path: ^internal/gapfill/view\.go$
        linters: [cyclop]
      - path: ^internal/guard/paths\.go$
        linters: [cyclop, revive]
      - path: ^internal/hook/hook\.go$
        linters: [revive]
      - path: ^internal/md/md\.go$
        linters: [cyclop]
      - path: ^internal/pkgcheck/lookup\.go$
        linters: [cyclop]
      - path: ^internal/resolve/resolve\.go$
        linters: [cyclop]
      - path: ^internal/rotate/rotate\.go$
        linters: [cyclop]
      - path: ^internal/run/base\.go$
        linters: [cyclop]
      - path: ^internal/run/run\.go$
        linters: [cyclop, funlen]
      - path: ^internal/slop/run\.go$
        linters: [cyclop, funlen]
      - path: ^internal/slop/segments\.go$
        linters: [cyclop, funlen, revive]
      - path: ^internal/sources/ci\.go$
        linters: [cyclop]
      - path: ^internal/sources/extract\.go$
        linters: [funlen]
      - path: ^internal/sources/yamltasks\.go$
        linters: [cyclop]
      - path: ^internal/stats/stats\.go$
        linters: [cyclop, funlen, revive]
      - path: ^internal/status/statusline\.go$
        linters: [cyclop]
      - path: ^internal/transcript/runs\.go$
        linters: [cyclop]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

# golangci-lint run reports gofmt findings too.
formatters:
  enable: [gofmt]

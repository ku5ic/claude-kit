version: "2"

linters:
  # dupl flags copied blocks before they drift. Threshold is in tokens: the
  # lowest that passes on today's tree; lower it as copies are removed.
  # errorlint: an error type assertion or == misses a wrapped error.
  # funlen, cyclop, and revive hold the size, branch, and nesting numbers
  # skills/engineering-fundamentals/reference/metric-thresholds.md owns;
  # go/e2e TestLintMatchesTheThresholds keeps them equal.
  enable: [dupl, errorlint, funlen, cyclop, revive]
  settings:
    dupl:
      threshold: 32
    errcheck:
      # Output and cleanup: a failed write to stdout or a failed close has no
      # recovery here, and hooks fail open by design.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - (io.Closer).Close
        - os.Remove
    funlen:
      lines: 50
      statements: -1
      ignore-comments: true
    cyclop:
      max-complexity: 15
    revive:
      rules:
        - name: max-control-nesting
          arguments: [3]
        - name: file-length-limit
          arguments:
            - max: 500
  exclusions:
    rules:
      # Test setup ignores errors on purpose; a failed step fails the assertion after it.
      - path: _test\.go
        linters: [errcheck]
      # Table-driven tests repeat their shape on purpose.
      - path: _test\.go
        linters: [dupl]
      # A test's length is its cases.
      - path: _test\.go
        linters: [funlen, cyclop, revive]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

# golangci-lint run reports gofmt findings too.
formatters:
  enable: [gofmt]

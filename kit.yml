# kit.yml
#
# The kit's own policy and data: skill maps, guard lists, what gap-fill may
# and may not accept, and the formatting kit applies when the project's own
# fixers don't. No tool, package manager, stack, or check catalog: those
# come from the project's configs and gap-fill's verified answers
# (go/internal/gapfill). Read by the kit binary (go/internal/config), which
# decodes it strictly: `bin/kit config --check` reports an unknown key.
# The overlay at ~/.claude/claude-kit.local.yml merges over it (maps merge,
# lists append, but slop.block_tiers is replaced and a slop rule replaces
# the one with its id); `bin/kit config` prints the result.
#
# security-patterns and wcag-audit are never mapped: they load by their own
# descriptions or when another skill names them.

# Skills loaded for every project regardless of detected stack.
# Empty by design: an always-blocking skill is paid for before the task is
# known. engineering-fundamentals loads through its own model-invocable
# description, and skill_file_map requires it on source edits when
# CLAUDE_GUARD_SKILLS=1.
global_skills: []

# File-to-skills map consumed by guard-dispatch's skills gate, and by
# <suggested-skills> for every file in the repo.
# Evaluated against every Edit/Write/MultiEdit target; matching is
# cumulative (a single file can satisfy multiple entries). Order matters:
# test entries precede extension entries so a .test.tsx file picks up
# test-patterns first.
#
# on: basename  -> match against basename only
# on: path      -> match against the full file path
# globs: [...]  -> shell-style globs (go/internal/guard Glob)
skill_file_map:
  - on: basename
    globs: ["*.ts", "*.tsx", "*.mts", "*.cts", "*.js", "*.jsx", "*.mjs", "*.cjs", "*.py", "*.rb", "*.go", "*.rs", "*.java", "*.sh", "*.vue"]
    skills: [engineering-fundamentals]
  - on: basename
    globs: ["*.test.*", "*.spec.*", "test_*.py", "*_test.py", "*_test.go", "*_spec.rb"]
    skills: [test-patterns]
  - on: basename
    globs: ["*.tsx"]
    skills: [typescript-patterns, react-patterns]
  - on: basename
    globs: ["*.ts", "*.mts", "*.cts"]
    skills: [typescript-patterns]
  - on: basename
    globs: ["*.jsx"]
    skills: [javascript-patterns, react-patterns]
  - on: basename
    globs: ["*.js", "*.mjs", "*.cjs"]
    skills: [javascript-patterns]
  - on: basename
    globs: ["*.vue"]
    skills: [vue-patterns]
  - on: basename
    globs: ["*.py"]
    skills: [python-patterns]
  - on: basename
    globs: ["*.sh", "*.bash", "*.zsh"]
    skills: [bash-patterns]
  - on: basename
    globs: ["Dockerfile", "docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml"]
    skills: [docker-patterns]
  - on: basename
    globs: ["tailwind.config.js", "tailwind.config.ts", "tailwind.config.mjs", "tailwind.config.cjs"]
    skills: [tailwind-patterns]
  - on: basename
    globs: ["next.config.js", "next.config.mjs", "next.config.ts"]
    skills: [next-app-router-patterns]
  - on: basename
    globs: ["nuxt.config.js", "nuxt.config.ts"]
    skills: [nuxt-patterns]
  - on: basename
    globs: ["manage.py"]
    skills: [django-patterns]
  - on: basename
    globs: ["*.graphql", "*.gql", "codegen.ts"]
    skills: [graphql-patterns]
  - on: basename
    globs: ["*.stories.*"]
    skills: [storybook-patterns]
  - on: basename
    globs: ["*.go"]
    skills: [go-patterns]
  - on: basename
    globs: ["*.tf", "*.tfvars"]
    skills: [opentofu-patterns]

# Declared-dependency-to-skills map for <suggested-skills>: a rule any of
# whose deps a subproject's package.json, Python manifests, or Gemfile
# declares suggests its skills. Python names match normalized (PEP 503).
# The stack report lists the deps it finds.
dependency_skills:
  - deps: [typescript]
    skills: [typescript-patterns]
  - deps: [next]
    skills: [react-patterns, next-app-router-patterns]
  - deps: [react]
    skills: [react-patterns]
  - deps: [nuxt]
    skills: [vue-patterns, nuxt-patterns]
  - deps: [vue]
    skills: [vue-patterns]
  - deps: [tailwindcss]
    skills: [tailwind-patterns]
  - deps: [graphql, "@apollo/client", urql, graphql-request]
    skills: [graphql-patterns]
  - deps: [storybook]
    skills: [storybook-patterns]
  - deps: [vitest, jest, "@playwright/test", cypress, pytest]
    skills: [test-patterns]
  - deps: [django]
    skills: [django-patterns]
  - deps: [djangorestframework]
    skills: [drf-patterns]
  - deps: [fastapi]
    skills: [fastapi-patterns]

# Action-conditioned trigger phrases for every skill skill_file_map and
# dependency_skills suggest.
# Consumed by the inject-context hook to build the <suggested-skills> block.
# Phrases name a concrete action, not a topic, so the reader knows when to load.
# global_skills entries, if any, are excluded; they are required, not
# suggested.
skill_triggers:
  javascript-patterns: "before writing or restructuring JavaScript modules, functions, or async flow"
  typescript-patterns: "before adding or changing types, generics, or type-level APIs"
  react-patterns: "before building or restructuring React components, hooks, or state"
  next-app-router-patterns: "before creating or restructuring routes, layouts, or server components in app/"
  vue-patterns: "before building or restructuring Vue components, composables, or reactivity"
  nuxt-patterns: "before working on Nuxt routing, server routes, or module config"
  tailwind-patterns: "before utility-class styling or design-token work"
  graphql-patterns: "before writing GraphQL operations or fragments, or changing the Apollo cache or codegen config"
  storybook-patterns: "before writing or changing stories, play functions, or Storybook config"
  go-patterns: "before writing or changing Go packages, error handling, or goroutines"
  test-patterns: "before writing or restructuring tests, fixtures, or assertions"
  engineering-fundamentals: "before the first edit to a source file"
  python-patterns: "before writing or restructuring Python modules, classes, or packaging"
  django-patterns: "before modeling, migrations, or view work in a Django app"
  drf-patterns: "before building serializers, viewsets, or API endpoints with Django REST Framework"
  fastapi-patterns: "before defining FastAPI routes, dependencies, or Pydantic models"
  docker-patterns: "before authoring or changing Dockerfiles or compose services"
  opentofu-patterns: "before writing or changing OpenTofu/Terraform resources, modules, variables, or state moves"
  bash-patterns: "before writing or modifying shell scripts"

# Guard lists. An overlay can append to any of them.

# Lockfile names, all tool-generated: guard-dispatch blocks direct edits
# to them (requirements.txt is hand-maintained, so it isn't one). Each
# directory holding one gets package-manager facts from gap-fill
# (go/internal/gapfill), accepted only when they cite it.
lockfile_globs: [bun.lockb, bun.lock, pnpm-lock.yaml, yarn.lock, package-lock.json, npm-shrinkwrap.json, uv.lock, poetry.lock,
  Pipfile.lock, pdm.lock, Gemfile.lock, Cargo.lock, composer.lock, go.sum]

# The gap-fill classifier's command, in place of claude -p: the request on
# its stdin, claude's --output-format json envelope on its stdout.
# classifier: [/path/to/classifier]

# Branches git push, and git reset --hard to, are blocked for.
protected_branches: [main, master, develop, production, release]

# Extensions of a new file Write gets a prompt for at the repo root: a
# report or log there belongs in scratch (rules/output.md section 3).
root_artifact_exts: [md, txt, log, html, csv]

# Global package installs guard-bash blocks: regexes on a command's name
# and arguments. Which manager a directory uses, and its add verbs, come
# from the project (gap-fill's verified facts), not from here.
global_installs:
  - '^(npm|pnpm|yarn|bun)[[:space:]]+(install|add|i)[[:space:]]+(.*[[:space:]])?(-g|--global)([[:space:]]|$)'
  - '^yarn[[:space:]]+global[[:space:]]+add([[:space:]]|$)'

# Dependency and build-output dirs a file walk never enters (hidden dirs are
# skipped too); rules/tooling.md's skip list matches it.
skip_dirs: [node_modules, vendor, dist, build, out, target, coverage, storybook-static, __pycache__, venv, .next, .turbo, .cache, .pnpm-store, .venv]

# Files sanitize-output leaves alone: translations, templates, snapshots, and
# fixtures, whose characters are content.
sanitize_skip: ["*.po", "*.pot", "*.svg", "*.html.j2", "*.j2", "*.jinja", "*.jinja2", "*.hbs", "*.erb", "*.liquid",
  "*/locales/*", "*/messages/*", "*/i18n/*", "*.snap", "*/fixtures/*", "*/__snapshots__/*", "*/testdata/*"]

# AI tells kit slop and the guards look for (skills/slop-patterns says what
# each is and how to rewrite it). Tier 1 is unambiguous, tier 2 structural,
# tier 3 counts only toward density: min hits, and threshold per per_words
# prose words. block_tiers block; other hits are logged. on: the surfaces a
# rule applies to (file, commit, pr, report, chat), all when absent. Code
# spans, quoted spans, fences, and blockquotes are never scanned. Turn a rule
# off with disabled_rules: slop-<id>, or slop-vocabulary for the word list.
slop:
  block_tiers: [1, 2]
  skip: ["*/testdata/*", "*/fixtures/*", "*.snap", "*/__snapshots__/*", "*/kit.yml", "*/claude-kit.local.yml"]
  density:
    per_words: 100
    threshold: 3
    min: 3
    words: [additionally, boasts, crucial, delve, delves, delved, delving, garner, garners, garnered, intricate,
      intricacies, interplay, landscape, meticulous, meticulously, pivotal, tapestry, testament, underscore,
      underscores, underscored, vibrant, bolstered, enhance, enhances, enhanced, enhancing, foster, fosters, fostered,
      fostering, highlights, highlighting, showcase, showcases, showcased, showcasing, emphasizes, emphasized,
      emphasizing, align with, aligns with, leverage, leverages, leveraged, leveraging, multifaceted, quietly, robust,
      comprehensive, dependable, echoed, universally, realm, realms, groundbreaking, commendable, enduring, deep dive]
  rules:
    - {id: hope-helps, tier: 1, match: '(?i)\bI hope (this|that|it) helps\b', fix: cut it}
    - id: offer-more
      tier: 1
      match: '(?i)\b(let me know if you|feel free to (ask|reach out)|happy to help|would you like me to)\b'
      fix: cut it; end at the last sentence that informs
    - id: stock-opener
      tier: 1
      match: '(?i)^\W*(certainly|absolutely|of course)!|^\W*(great|good|excellent) question\b'
      fix: cut the opener; start with the answer
    - id: commit-opener
      tier: 1
      on: [commit]
      match: '(?i)^\W*(?:(?:feat|fix|chore|refactor|docs|test|perf|build|ci|style)(?:\([^)]*\))?!?:)?\s*(?:certainly|here is|i have|let me|in this commit|this commit)\b'
      fix: open with what changed
    - {id: absolutely-right, tier: 1, match: '(?i)\byou''?re (absolutely|completely|totally) right\b', fix: cut it; say what changes}
    - {id: as-an-ai, tier: 1, match: '(?i)\bas an AI( language)? model\b|\bI''?m (just )?an AI\b', fix: cut it}
    - {id: in-conclusion, tier: 1, match: '(?i)^\W*(in conclusion|in summary)\b|^\W*overall,', fix: cut the recap}
    - id: citation-leak
      tier: 1
      match: 'contentReference\[oaicite|oai_citation|\bturn\d+(search|view|fetch)\d+\b'
      fix: remove the leaked citation markup
    - {id: ai-utm, tier: 1, match: 'utm_source=(chatgpt\.com|openai|copilot\.com)|referrer=grok\.com', fix: strip the tracking parameter}
    - id: placeholder
      tier: 1
      match: '\[(Your Name|Name|Company( Name)?|Year|Date|Insert [^\]]+)\]|\b20\d\d-XX-XX\b|\bINSERT_[A-Z_]+\b|example\.com/source\d'
      fix: fill in the real value, or cut it
    - {id: copula, tier: 2, match: '(?i)\b(serves|serve|served|stands|stood|functions) as (a|an|the)\b', fix: is}
    - {id: boasts, tier: 2, match: '(?i)\bboasts?\b', fix: has}
    - {id: not-only, tier: 2, match: '(?i)\bnot only\b.*\bbut also\b', fix: 'state both plainly, or keep the one that matters'}
    - id: not-x-but-y
      tier: 2
      # "but" counts only before a noun phrase; "not fast, but it works" concedes, it doesn't correct.
      match: '(?i)\b(it''?s|this is|that''?s) not (just |merely |only )?[^.,;:]{1,40}[,;] (it''?s|but (rather )?(a|an|the)\b)'
      fix: state what it is
    - id: ing-tail
      tier: 2
      match: '(?i),\s+(highlighting|underscoring|emphasizing|ensuring|reflecting|fostering|showcasing|contributing to|paving the way)\b'
      fix: state the fact the clause gestures at, or cut it
    - id: significance
      tier: 2
      match: '(?i)\b(plays?|played) an? (key|crucial|pivotal|vital|significant|central) role\b|\ba testament to\b|\bindelible mark\b|\bevolving landscape\b|\bsetting the stage for\b|\bunderscores? (its|the) importance\b|\bsh(ed|eds|edding) (new )?light on\b'
      fix: name the concrete effect, or cut it
    - id: navigating
      tier: 2
      match: '(?i)\bnavigat(e|es|ing) the (complexities|intricacies|landscape|nuances|challenges)\b'
      fix: name the actual problem and what handles it
    - {id: vague-connection, tier: 2, match: '(?i)\b(is|are|was|were) (closely )?associated with\b', fix: name the actual relation}
    - {id: despite-challenges, tier: 2, match: '(?i)\bdespite (its|their|these|this)\b.*\bchallenges\b', fix: state the specific problem}
    - {id: worth-noting, tier: 2, match: '(?i)\b(it''?s|it is) (important|worth) (to note|noting|mentioning)\b', fix: cut it; state the point}
    - id: corrective-framing
      tier: 2
      match: '(?i)\bshould not be confused with\b|\bdoes not by itself establish\b'
      fix: state the claim directly
    - id: generic-reason
      tier: 2
      on: [commit, pr, report]
      match: '(?i)\b(improv|enhanc)(e|es|ed|ing) (the )?(readability|maintainability|clarity|code quality|consistency|robustness)\b|\bfor (better )?(readability|maintainability|clarity)\b'
      fix: say what changed and why it matters
    - {id: while-preserving, tier: 3, on: [commit, pr], match: '(?i)\bwhile (preserving|maintaining|retaining|keeping)\b'}
    - {id: addressed-feedback, tier: 2, on: [commit, pr], match: '(?i)\baddress(es|ed|ing)? (the )?(review |PR )?(feedback|comments)\b', fix: say what changed}
    - {id: streamlined, tier: 2, on: [commit, pr], match: '(?i)\bstreamlin(e|es|ed|ing)\b', fix: say what was removed or merged}
    - {id: rather-than, tier: 3, match: '(?i)\brather than\b'}
    - {id: bold-in-prose, tier: 3, match: '\w[^*\n]*\s\*\*[^*\n]+\*\*'}
    # UI code as written (on: [ui]): .tsx, .jsx, .vue, .svelte, .html, .css, .scss.
    - {id: ui-placeholder, tier: 2, on: [ui], match: '(?i)\blorem ipsum\b|>\s*Feature (one|two|1|2)\s*<', fix: put the real content in}
    - id: ui-emoji-label
      tier: 2
      on: [ui]
      match: '<(h[1-6]|button|a|li)\b[^>]*>[^<]*[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]'
      fix: drop the emoji; the words carry the label
    - id: ui-default-gradient
      tier: 2
      on: [ui]
      match: '\bfrom-(purple|violet|indigo|fuchsia)-\d+\b.*\bto-(blue|indigo|pink|cyan)-\d+\b'
      fix: take the colors from the project's tokens, or drop the gradient
    - id: ui-gradient-text
      tier: 2
      on: [ui]
      match: '\bbg-clip-text\b.*\btext-transparent\b|\btext-transparent\b.*\bbg-clip-text\b'
      fix: solid text in a token color
    - id: ui-marketing
      tier: 2
      on: [ui]
      match: '(?i)\b(supercharge[sd]?|empower(s|ed)?|world-class|enterprise-grade|reimagined)\b|\bthe future of\b|\boops!'
      fix: say what the product does, or what went wrong and how to fix it
    - {id: ui-glass, tier: 3, on: [ui], match: '\bbackdrop-blur(-\w+)?\b|\bblur-3xl\b|\bshadow-\[0_0_'}
    - {id: ui-eyebrow, tier: 3, on: [ui], match: '\buppercase\b.*\btracking-(widest|\[0\.\d+em\])'}
    - {id: ui-chrome-glyph, tier: 3, on: [ui], match: '\x{00B7}|\x{2192}'}

# MCP tools, by the verbs in the tool part of mcp__<server>__<tool>, split
# on _, -, and case. A write verb means the tool sends text out of the
# session, and guard-connector scans that text for AI tells. A read verb
# with no write verb means it only reads. Anything else is neither.
# code_fields are input fields that hold code, which neither the slop scan
# nor the claim verifier reads.
connectors:
  write_verbs: [send, create, update, post, reply, comment, forward, publish, edit, write, share, schedule, upload,
    save, add, set, respond, react, merge, move, delete, remove, trash, batch, generate, execute, use]
  read_verbs: [get, read, search, list, fetch, query, find, view, lookup, resolve, describe, whoami]
  code_fields: [code]

# What guard-weaken reads an edit by (go/internal/weaken). An added line
# matching skips (in a test file) or suppressions (in any file but skip's)
# blocks unless `kit: allow <reason>` is on it or the line above. A test
# file left with fewer lines matching assertions asks first.
weakened_checks:
  skip: ["*.md", "*.mdx", "*.txt", "*.rst", "*/testdata/*", "*/fixtures/*", "*/kit.yml", "*/claude-kit.local.yml"]
  test_files: ["*_test.go", "*.test.[jt]s", "*.test.[jt]sx", "*.spec.[jt]s", "*.spec.[jt]sx", "*/test_*.py", "*_test.py",
    "*/conftest.py", "*/tests/*", "*/__tests__/*"]
  skips: ['\bt\.Skip(Now|f)?\(', '\b(it|test|describe|context)\.(skip|only|todo)\(', '(?:^|[^.\w$])x(it|test|describe)\(',
    '(?:^|[^.\w$])f(it|describe)\(', '@pytest\.mark\.(skip|skipif|xfail)\b', '\bpytest\.skip\(', '@unittest\.skip']
  suppressions: ['//\s*nolint\b', 'eslint-disable', '@ts-(ignore|nocheck|expect-error)\b', '#\s*type:\s*ignore\b',
    '#\s*noqa\b', '#\s*pyright:\s*ignore\b', '#\s*pylint:\s*disable', '#\s*shellcheck\s+disable=', 'biome-ignore',
    '//\s*lint:ignore\b']
  assertions: ['\bt\.(Error|Errorf|Fatal|Fatalf|Fail|FailNow)\(', '\b(assert|require)\.[A-Z]\w*\(', '\bexpect\(',
    '\bassert(\.\w+)?\(', '^\s*assert\b', '\bself\.assert\w+\(', '\bpytest\.raises\(']

# Registry lookups for each package a manager's add verb names
# (go/internal/pkgcheck): per ecosystem, the managers it covers, the
# pattern a package name matches, the command ({pkg} is the name), and
# what it prints when no such package exists. A missing package blocks; a
# lookup that times out or fails any other way blocks nothing. parents
# retries a missing path at each parent, for a Go package inside a module.
# Lookups run outside the project, so its config runs nothing before the
# add is approved. A package isn't looked up when a private file from the
# project up has a line matching its pattern ({scope} is the package's
# scope, without @), when a glob private_cmd prints matches its path, or
# when the command has a registry_flags flag.
# value_flags take the next word as their value, which is never a package.
# timeout is seconds for all of one command's lookups; 0 turns them off.
package_lookups:
  timeout: 15
  ecosystems:
    npm:
      managers: [npm, pnpm, yarn, bun]
      name: '^(@[a-z0-9][\w.-]*/)?[a-z0-9][\w.-]*$'
      cmd: [npm, view, "{pkg}", name]
      missing: '\bE404\b'
      private:
        .npmrc: '^\s*(@{scope}:)?registry\s*='
        .yarnrc.yml: '^npmRegistryServer\s*:|^\s+["'']?@?{scope}["'']?\s*:'
        bunfig.toml: '^\s*registry\s*=|^\s*["'']?@?{scope}["'']?\s*='
      value_flags: [--prefix, -C, --dir, --cwd, -w, --workspace, -F, --filter, --tag, --registry, --save-prefix, --omit, --include, --userconfig, --cache]
      registry_flags: [--registry]
    go:
      managers: [go]
      name: '^[a-z0-9.-]+\.[a-z]{2,}(/[\w.~-]+)+$'
      cmd: [go, list, -m, "{pkg}@latest"]
      missing: 'no matching versions|not found|410 Gone'
      parents: true
      private_cmd: [go, env, GOPRIVATE, GONOPROXY]

# The claim verifier (go/internal/claims): a claude -p session that checks
# each factual claim in a text against the session's tool results, and
# checks what they don't cover with read-only tools. model and budget_usd
# are passed to it, timeout is its limit in seconds (0 turns it off), and
# allow names more tools it may call; a write tool is never let through.
# command replaces the claude call.
claims:
  model: sonnet
  timeout: 240
  budget_usd: 1
  allow: []

# What kit bundle chat ships to claude.ai chat, where no hook, repo, or kit
# on PATH exists. A skill stays out unless skills names it. description is
# the plugin's, 500 characters at most.
chat_bundle:
  description: The kit's writing and investigation skills for claude.ai chat, working on pasted text and code. Hooks and guards stay in Claude Code.
  skills: [engineering-fundamentals, investigate, slop-patterns, unslop, write]
  rules: [rules/output.md, rules/evidence.md, rules/change.md]

# Shell rc files: direct writes are blocked, the dotfiles repo is the source.
rc_files: ["~/.zshrc", "~/.zprofile", "~/.bashrc", "~/.bash_profile", "~/.profile"]

# Credential and key files guard-bash refuses to read. A "~/" entry is a
# path under $HOME, a directory when it ends in "/"; any other entry is a
# basename glob. These guard a plugin install, which can't ship deny rules.
sensitive_paths:
  - ".env"
  - ".env.*"
  - "*.pem"
  - "*.key"
  - "*.p12"
  - "*.pfx"
  - id_rsa
  - id_ed25519
  - id_ecdsa
  - "~/.ssh/"
  - "~/.gnupg/"
  - "~/Library/Keychains/"
  - "~/.aws/credentials"
  - "~/.aws/config"
  - "~/.docker/config.json"
  - "~/.config/gh/hosts.yml"
  - "~/.netrc"
  - "~/.pgpass"
  - "~/.npmrc"
  - "~/.pypirc"
  - "~/.cargo/credentials"
  - "~/.gem/credentials"

# Line cap for the kit's JSONL logs.
log_max_lines: 10000

# Rule slugs, as logged in guards.jsonl, that block() lets through. Meant for
# the overlay: a disabled rule is still logged, as "disabled".
disabled_rules: []

# CI steps and jobs the kit never runs (go/internal/sources/ci.go).
gate_discovery:
  #   deny_commands  a step holding one of these words (or word runs) is skipped
  #   deny_names     a job or step whose name holds one of these words is skipped
  #   deny_actions   a job using an action with one of these prefixes is skipped
  deny_commands: [publish, deploy, upload, release, "docker push", "docker login", "gh release", twine, "npm publish", "pnpm publish",
    "yarn publish", "cargo publish", "gem push", "terraform apply", "tofu apply", aws, gcloud, az, wrangler, vercel, netlify, flyctl,
    heroku, kubectl, helm, ssh, scp, rsync, cosign, gpg, codecov, coveralls, curl, wget]
  deny_names: [release, deploy, deployment, publish, upload, pages, docs-deploy, notify, slack, discord]
  deny_actions: [aws-actions/, google-github-actions/auth, google-github-actions/setup-gcloud, azure/login, docker/login-action,
    docker/build-push-action, hashicorp/setup-terraform, pulumi/]

# Flags no check may set, alone or as flag=value that doesn't turn them off
# (--watch=false does): a check verdict, segment, form, or proposal setting
# one is rejected, since it writes files or never exits. Fixers may.
deny_flags: [--fix, --write, --watch, --watchAll, --apply, --apply-unsafe, --autocorrect, --autocorrect-all, --auto-correct,
  --auto-correct-all, --ui]

# Environment every gate runs with, as NAME=value. pnpm would otherwise
# install before a script runs, changing node_modules mid-check.
gate_env: [pnpm_config_verify_deps_before_run=false]

# Seconds the Stop hook's checks run, in parallel, each killed after this
# and reported as a SKIP, never a block. The Stop hook itself allows 300.
gate_timeout: 90

# Pin files that pin tools for every project, after the project's own: a
# tool a project doesn't provide runs from PATH only when a pin names it
# and PATH's copy is its manager's. Each is named like a project pin file
# (Brewfile, .tool-versions, mise.toml); "~/" is $HOME. Meant for the
# overlay: [~/.dotfiles/Brewfile].
user_pins: []

# Turning gates off from the overlay.
#   disabled_task_providers  provider names (package-scripts, make, just,
#                            pdm, poe, rake, cargo-alias, composer,
#                            taskfile); their tasks aren't read at all
#   disabled_checks          a check kind ("lint"), or a gate's label as
#                            run-checks prints it ("lint (package.json:
#                            lint:css) [web]"); without its "[dir]", it
#                            names every subproject's copy
disabled_task_providers: []
disabled_checks: []

# What the format-dispatch hook runs on an edited file the project's own
# fixers don't claim (go/internal/hooks/format.go). Per rule, by globs:
#   run   the first command on PATH formats it; {file} is its path, and
#         stdout: true replaces the file with what the command prints.
#         The last rule that matches wins, so an overlay's rule overrides.
#   note  runs whatever claims the file, its output shown, nothing changed.
on_edit:
  - globs: ["*.md", "*.mdx", "*.markdown"]
    run:
      - {cmd: "prettierd {file}", stdout: true}
      - {cmd: "prettier --write {file}"}
      - {cmd: "deno fmt {file}"}
      - {cmd: "mdformat {file}"}
  - globs: ["*.sh", "*.bash"]
    note: "shellcheck {file}"

# Chat reply word ceilings (rules/output.md section 0), set per prompt by the
# reply-length hook, which corrects an overrun silently on the next prompt.
# Fenced code doesn't count.
# A prompt with a detail trigger has no ceiling; with an explain trigger,
# the explain one. uncapped_commands: slash commands (as typed, without the
# slash) whose turn is a report, so none. write: the /write kinds that print
# to the terminal, code included; the others write a file and reply with its
# path. 0 turns a ceiling off.
reply_limits:
  chat: 40
  explain: 80
  explain_triggers: [explain, why, tradeoff, tradeoffs, review, audit]
  detail_triggers: [in detail, walk me through, long version]
  uncapped_commands: [verify, code-review, kit:audit, kit:deps, audit, deps]
  write:
    commit: 40
    devnote: 40
    explainer: 150

# The CLIs rules/tooling.md steers toward. <tooling> reports which of them
# are on PATH as available: and missing: lines, so a rule never sends Claude
# to a binary this machine lacks.
tools: [rg, sg, fd, tokei, gitleaks, trufflehog, hyperfine, jq, gron, yq, qsv, git-absorb, actionlint]

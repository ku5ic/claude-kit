# kit.yml
#
# The kit's own policy and data: skill maps, guard lists, what gap-fill may
# and may not accept, and the formatting kit applies when the project's own
# fixers don't. No tool, package manager, stack, or check catalog: those
# come from the project's configs and gap-fill's verified answers
# (go/internal/gapfill). Read by the kit binary (go/internal/config), which
# decodes it strictly: `bin/kit config --check` reports an unknown key.
# The overlay at ~/.claude/claude-kit.local.yml merges over it (maps merge,
# lists append); `bin/kit config` prints the result.
#
# security-patterns and wcag-audit are never mapped: invoked by hand.

# Skills loaded for every project regardless of detected stack.
# Empty by design: an always-blocking skill is paid for before the task is
# known. engineering-fundamentals loads through its own model-invocable
# description, and skill_file_map requires it on source edits when
# CLAUDE_GUARD_SKILLS=1.
global_skills: []

# File-to-skills map consumed by guard-dispatch's skills gate, and by
# <suggested-skills> for every file in the repo.
# Evaluated against every Edit/Write/MultiEdit target; matching is
# cumulative (a single file can satisfy multiple entries). Order matters:
# test entries precede extension entries so a .test.tsx file picks up
# test-patterns first.
#
# on: basename  -> match against basename only
# on: path      -> match against the full file path
# globs: [...]  -> shell-style globs (go/internal/guard Glob)
skill_file_map:
  - on: basename
    globs: ["*.ts", "*.tsx", "*.mts", "*.cts", "*.js", "*.jsx", "*.mjs", "*.cjs", "*.py", "*.rb", "*.go", "*.rs", "*.java", "*.sh", "*.vue"]
    skills: [engineering-fundamentals]
  - on: basename
    globs: ["*.test.*", "*.spec.*", "test_*.py", "*_test.py", "*_test.go", "*_spec.rb"]
    skills: [test-patterns]
  - on: basename
    globs: ["*.tsx"]
    skills: [typescript-patterns, react-patterns]
  - on: basename
    globs: ["*.ts", "*.mts", "*.cts"]
    skills: [typescript-patterns]
  - on: basename
    globs: ["*.jsx"]
    skills: [javascript-patterns, react-patterns]
  - on: basename
    globs: ["*.js", "*.mjs", "*.cjs"]
    skills: [javascript-patterns]
  - on: basename
    globs: ["*.vue"]
    skills: [vue-patterns]
  - on: basename
    globs: ["*.py"]
    skills: [python-patterns]
  - on: basename
    globs: ["*.sh", "*.bash", "*.zsh"]
    skills: [bash-patterns]
  - on: basename
    globs: ["Dockerfile", "docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml"]
    skills: [docker-patterns]
  - on: basename
    globs: ["tailwind.config.js", "tailwind.config.ts", "tailwind.config.mjs", "tailwind.config.cjs"]
    skills: [tailwind-patterns]
  - on: basename
    globs: ["next.config.js", "next.config.mjs", "next.config.ts"]
    skills: [next-app-router-patterns]
  - on: basename
    globs: ["nuxt.config.js", "nuxt.config.ts"]
    skills: [nuxt-patterns]
  - on: basename
    globs: ["manage.py"]
    skills: [django-patterns]
  - on: basename
    globs: ["*.graphql", "*.gql", "codegen.ts"]
    skills: [graphql-patterns]
  - on: basename
    globs: ["*.stories.*"]
    skills: [storybook-patterns]
  - on: basename
    globs: ["*.go"]
    skills: [go-patterns]
  - on: basename
    globs: ["*.tf", "*.tfvars"]
    skills: [opentofu-patterns]

# Declared-dependency-to-skills map for <suggested-skills>: a rule any of
# whose deps a subproject's package.json, Python manifests, or Gemfile
# declares suggests its skills. Python names match normalized (PEP 503).
# The stack report lists the deps it finds.
dependency_skills:
  - deps: [typescript]
    skills: [typescript-patterns]
  - deps: [next]
    skills: [react-patterns, next-app-router-patterns]
  - deps: [react]
    skills: [react-patterns]
  - deps: [nuxt]
    skills: [vue-patterns, nuxt-patterns]
  - deps: [vue]
    skills: [vue-patterns]
  - deps: [tailwindcss]
    skills: [tailwind-patterns]
  - deps: [graphql, "@apollo/client", urql, graphql-request]
    skills: [graphql-patterns]
  - deps: [storybook]
    skills: [storybook-patterns]
  - deps: [vitest, jest, "@playwright/test", cypress, pytest]
    skills: [test-patterns]
  - deps: [django]
    skills: [django-patterns]
  - deps: [djangorestframework]
    skills: [drf-patterns]
  - deps: [fastapi]
    skills: [fastapi-patterns]

# Action-conditioned trigger phrases for every skill skill_file_map and
# dependency_skills suggest.
# Consumed by the inject-context hook to build the <suggested-skills> block.
# Phrases name a concrete action, not a topic, so the reader knows when to load.
# global_skills entries, if any, are excluded; they are required, not
# suggested.
skill_triggers:
  javascript-patterns: "before writing or restructuring JavaScript modules, functions, or async flow"
  typescript-patterns: "before adding or changing types, generics, or type-level APIs"
  react-patterns: "before building or restructuring React components, hooks, or state"
  next-app-router-patterns: "before creating or restructuring routes, layouts, or server components in app/"
  vue-patterns: "before building or restructuring Vue components, composables, or reactivity"
  nuxt-patterns: "before working on Nuxt routing, server routes, or module config"
  tailwind-patterns: "before utility-class styling or design-token work"
  graphql-patterns: "before writing GraphQL operations or fragments, or changing the Apollo cache or codegen config"
  storybook-patterns: "before writing or changing stories, play functions, or Storybook config"
  go-patterns: "before writing or changing Go packages, error handling, or goroutines"
  test-patterns: "before writing or restructuring tests, fixtures, or assertions"
  engineering-fundamentals: "before the first edit to a source file"
  python-patterns: "before writing or restructuring Python modules, classes, or packaging"
  django-patterns: "before modeling, migrations, or view work in a Django app"
  drf-patterns: "before building serializers, viewsets, or API endpoints with Django REST Framework"
  fastapi-patterns: "before defining FastAPI routes, dependencies, or Pydantic models"
  docker-patterns: "before authoring or changing Dockerfiles or compose services"
  opentofu-patterns: "before writing or changing OpenTofu/Terraform resources, modules, variables, or state moves"
  bash-patterns: "before writing or modifying shell scripts"

# Guard lists. An overlay can append to any of them.

# Lockfile names, all tool-generated: guard-dispatch blocks direct edits
# to them (requirements.txt is hand-maintained, so it isn't one). Each
# directory holding one gets package-manager facts from gap-fill
# (go/internal/gapfill), accepted only when they cite it.
lockfile_globs: [bun.lockb, bun.lock, pnpm-lock.yaml, yarn.lock, package-lock.json, npm-shrinkwrap.json, uv.lock, poetry.lock,
  Pipfile.lock, pdm.lock, Gemfile.lock, Cargo.lock, composer.lock, go.sum]

# The gap-fill classifier's command, in place of claude -p: the request on
# its stdin, claude's --output-format json envelope on its stdout.
# classifier: [/path/to/classifier]

# Branches git push, and git reset --hard to, are blocked for.
protected_branches: [main, master, develop, production, release]

# Extensions of a new file Write gets a prompt for at the repo root: a
# report or log there belongs in scratch (rules/output.md section 3).
root_artifact_exts: [md, txt, log, html, csv]

# Global package installs guard-bash blocks: regexes on a command's name
# and arguments. Which manager a directory uses, and its add verbs, come
# from the project (gap-fill's verified facts), not from here.
global_installs:
  - '^(npm|pnpm|yarn|bun)[[:space:]]+(install|add|i)[[:space:]]+(.*[[:space:]])?(-g|--global)([[:space:]]|$)'
  - '^yarn[[:space:]]+global[[:space:]]+add([[:space:]]|$)'

# Dependency and build-output dirs a file walk never enters (hidden dirs are
# skipped too); rules/tooling.md's skip list matches it.
skip_dirs: [node_modules, vendor, dist, build, out, target, coverage, storybook-static, __pycache__, venv, .next, .turbo, .cache, .pnpm-store, .venv]

# Files sanitize-output leaves alone: translations, templates, snapshots, and
# fixtures, whose characters are content.
sanitize_skip: ["*.po", "*.pot", "*.svg", "*.html.j2", "*.j2", "*.jinja", "*.jinja2", "*.hbs", "*.erb", "*.liquid",
  "*/locales/*", "*/messages/*", "*/i18n/*", "*.snap", "*/fixtures/*", "*/__snapshots__/*", "*/testdata/*"]

# Shell rc files: direct writes are blocked, the dotfiles repo is the source.
rc_files: ["~/.zshrc", "~/.zprofile", "~/.bashrc", "~/.bash_profile", "~/.profile"]

# Credential and key files guard-bash refuses to read. A "~/" entry is a
# path under $HOME, a directory when it ends in "/"; any other entry is a
# basename glob. These guard a plugin install, which can't ship deny rules.
sensitive_paths:
  - ".env"
  - ".env.*"
  - "*.pem"
  - "*.key"
  - "*.p12"
  - "*.pfx"
  - id_rsa
  - id_ed25519
  - id_ecdsa
  - "~/.ssh/"
  - "~/.gnupg/"
  - "~/Library/Keychains/"
  - "~/.aws/credentials"
  - "~/.aws/config"
  - "~/.docker/config.json"
  - "~/.config/gh/hosts.yml"
  - "~/.netrc"
  - "~/.pgpass"
  - "~/.npmrc"
  - "~/.pypirc"
  - "~/.cargo/credentials"
  - "~/.gem/credentials"

# Line cap for the kit's JSONL logs.
log_max_lines: 10000

# Rule slugs, as logged in guards.jsonl, that block() lets through. Meant for
# the overlay: a disabled rule is still logged, as "disabled".
disabled_rules: []

# CI steps and jobs the kit never runs (go/internal/ci).
gate_discovery:
  #   deny_commands  a step holding one of these words (or word runs) is skipped
  #   deny_names     a job or step whose name holds one of these words is skipped
  #   deny_actions   a job using an action with one of these prefixes is skipped
  deny_commands: [publish, deploy, upload, release, "docker push", "docker login", "gh release", twine, "npm publish", "pnpm publish",
    "yarn publish", "cargo publish", "gem push", "terraform apply", "tofu apply", aws, gcloud, az, wrangler, vercel, netlify, flyctl,
    heroku, kubectl, helm, ssh, scp, rsync, cosign, gpg, codecov, coveralls, curl, wget]
  deny_names: [release, deploy, deployment, publish, upload, pages, docs-deploy, notify, slack, discord]
  deny_actions: [aws-actions/, google-github-actions/auth, google-github-actions/setup-gcloud, azure/login, docker/login-action,
    docker/build-push-action, hashicorp/setup-terraform, pulumi/]

# Flags no check may set, alone or as flag=value that doesn't turn them off
# (--watch=false does): a check verdict, segment, form, or proposal setting
# one is rejected, since it writes files or never exits. Fixers may.
deny_flags: [--fix, --write, --watch, --watchAll, --apply, --apply-unsafe, --autocorrect, --autocorrect-all, --auto-correct,
  --auto-correct-all, --ui]

# Environment every gate runs with, as NAME=value. pnpm would otherwise
# install before a script runs, changing node_modules mid-check.
gate_env: [pnpm_config_verify_deps_before_run=false]

# Seconds the Stop hook's checks run, in parallel, each killed after this
# and reported as a SKIP, never a block. The Stop hook itself allows 300.
gate_timeout: 90

# Pin files that pin tools for every project, after the project's own: a
# tool a project doesn't provide runs from PATH only when a pin names it
# and PATH's copy is its manager's. Each is named like a project pin file
# (Brewfile, .tool-versions, mise.toml); "~/" is $HOME. Meant for the
# overlay: [~/.dotfiles/Brewfile].
user_pins: []

# Turning gates off from the overlay.
#   disabled_task_providers  provider names (package-scripts, make, just,
#                            pdm, poe, rake, cargo-alias, composer,
#                            taskfile); their tasks aren't read at all
#   disabled_checks          a check kind ("lint"), or a gate's label as
#                            run-checks prints it ("lint (package.json:
#                            lint:css) [web]"); without its "[dir]", it
#                            names every subproject's copy
disabled_task_providers: []
disabled_checks: []

# What the format-dispatch hook runs on an edited file the project's own
# fixers don't claim (go/internal/hooks/format.go). Per rule, by globs:
#   run   the first command on PATH formats it; {file} is its path, and
#         stdout: true replaces the file with what the command prints.
#         The last rule that matches wins, so an overlay's rule overrides.
#   note  runs whatever claims the file, its output shown, nothing changed.
on_edit:
  - globs: ["*.md", "*.mdx", "*.markdown"]
    run:
      - {cmd: "prettierd {file}", stdout: true}
      - {cmd: "prettier --write {file}"}
      - {cmd: "deno fmt {file}"}
      - {cmd: "mdformat {file}"}
  - globs: ["*.sh", "*.bash"]
    note: "shellcheck {file}"

# Chat reply word ceilings (rules/output.md section 0), set per prompt by the
# reply-length hook, which corrects an overrun silently on the next prompt.
# Fenced code doesn't count.
# A prompt with a detail trigger has no ceiling; with an explain trigger,
# the explain one. uncapped_commands: slash commands (as typed, without the
# slash) whose turn is a report, so none. write: the /write kinds that print
# to the terminal, code included; the others write a file and reply with its
# path. 0 turns a ceiling off.
reply_limits:
  chat: 40
  explain: 80
  explain_triggers: [explain, why, tradeoff, tradeoffs, review, audit]
  detail_triggers: [in detail, walk me through, long version]
  uncapped_commands: [verify, code-review, kit:audit, kit:deps, audit, deps]
  write:
    commit: 40
    devnote: 40
    explainer: 150

# The CLIs rules/tooling.md steers toward. <tooling> reports which of them
# are on PATH as available: and missing: lines, so a rule never sends Claude
# to a binary this machine lacks.
tools: [rg, sg, fd, tokei, gitleaks, trufflehog, hyperfine, jq, gron, yq, qsv, sd, sponge, git-absorb, actionlint]

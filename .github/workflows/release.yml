name: release

# Every push to main whose .claude-plugin/plugin.json version has no tag yet
# publishes v<version> with the four binaries, so a release is a PR that
# bumps the version, squash-merged into main. It waits for ci on the same
# commit, so a direct push that skips branch protection can't ship red code.
# Installs track main, so until this finishes a freshly updated client finds
# no binary; bin/kit fails open and retries on the next call. A failed run
# leaves that state in place: rerun it, the tag only exists once it publishes.
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version
        id: pre
        run: |
          version="$(jq -r .version .claude-plugin/plugin.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "plugin.json version '$version' is not semver"; exit 1; }
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "v$version already released; nothing to do"
          else
            echo "version=$version" >>"$GITHUB_OUTPUT"
          fi

      - name: Wait for CI
        if: steps.pre.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=
          for _ in $(seq 30); do
            run_id="$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml --event push --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          [[ -n "$run_id" ]] || { echo "no ci run for $GITHUB_SHA after 5 minutes"; exit 1; }
          gh run watch "$run_id" --exit-status --interval 10 >/dev/null || { echo "ci on $GITHUB_SHA did not succeed"; exit 1; }

      - uses: actions/setup-go@v7
        if: steps.pre.outputs.version
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        if: steps.pre.outputs.version
        run: go/build.sh

      - name: Publish release
        if: steps.pre.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pre.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes bin/kit-"$VERSION"-*

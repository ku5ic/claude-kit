name: release

# Every push to main whose .claude-plugin/plugin.json version has no tag yet
# publishes v<version> with the four binaries. main only moves by merging a
# PR from dev, so a release is: bump the version on dev, merge the PR.
# Installs track main, so for the minute this runs a freshly updated client
# finds no binary; bin/kit fails open and retries on the next call.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version
        id: pre
        run: |
          version="$(jq -r .version .claude-plugin/plugin.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "plugin.json version '$version' is not semver"; exit 1; }
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "v$version already released; nothing to do"
          else
            echo "version=$version" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        if: steps.pre.outputs.version
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        if: steps.pre.outputs.version
        run: go/build.sh

      - name: Publish release
        if: steps.pre.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pre.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes bin/kit-"$VERSION"-*

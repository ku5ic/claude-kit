name: release

# Every push to main whose .claude-plugin/plugin.json version has no tag yet
# publishes v<version> with the four binaries and the claude.ai chat zip, so
# a release is a PR that bumps the version, squash-merged into main. It waits
# for ci on the same commit, so a direct push that skips branch protection
# can't ship red code.
# Installs track main, so until this finishes a freshly updated client finds
# no binary; bin/kit fails open and retries on the next call. A failed run
# leaves that state in place: rerun it, the tag only exists once it publishes.
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # gh reads GH_TOKEN, so the write token needn't sit in .git/config
      # while the build runs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version
        id: pre
        run: |
          version="$(jq -r .version .claude-plugin/plugin.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "plugin.json version '$version' is not semver"; exit 1; }
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "v$version already released; nothing to do"
          else
            echo "version=$version" >>"$GITHUB_OUTPUT"
          fi

      - name: Wait for CI
        if: steps.pre.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=
          for _ in $(seq 30); do
            run_id="$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml --event push --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          [[ -n "$run_id" ]] || { echo "no ci run for $GITHUB_SHA after 5 minutes"; exit 1; }
          gh run watch "$run_id" --exit-status --interval 10 >/dev/null || { echo "ci on $GITHUB_SHA did not succeed"; exit 1; }

      - uses: actions/setup-go@v7
        if: steps.pre.outputs.version
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        if: steps.pre.outputs.version
        run: go/build.sh

      # bin/kit checks a download against its .sha256 before running it.
      - name: Checksum
        if: steps.pre.outputs.version
        working-directory: bin
        env:
          VERSION: ${{ steps.pre.outputs.version }}
        run: for f in kit-"$VERSION"-*; do sha256sum "$f" >"$f.sha256"; done

      # Before publish, so a release never ships without it; ci already ran
      # bundle chat --check on this commit.
      - name: Chat bundle
        if: steps.pre.outputs.version
        env:
          VERSION: ${{ steps.pre.outputs.version }}
        run: bin/kit-"$VERSION"-linux-amd64 bundle chat

      # Notes list each PR with its branch commits, which squash merges drop
      # from main; PR numbers come from the "(#N)" squash subject suffix, and
      # sed, not grep, so a range with no PR doesn't fail under pipefail.
      # The chat zip is named on its own: the binaries' glob doesn't match it.
      - name: Publish release
        if: steps.pre.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pre.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          prev="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          range="${prev:+$prev..}$GITHUB_SHA"
          {
            echo "## What's Changed"
            git log --reverse --format=%s "$range" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p' | while read -r pr; do
              pr_json="$(gh pr view "$pr" --json title,url,author)"
              jq -r '"* \(.title) by @\(.author.login) in \(.url)"' <<<"$pr_json"
              # A commit names its author only when it isn't the PR author; an
              # unlinked commit email has no login, so its git name stands in.
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/commits" |
                jq -r --arg repo "$GITHUB_REPOSITORY" --arg pr "$pr" --arg author "$(jq -r .author.login <<<"$pr_json")" '.[]
                  | "  - [`\(.sha[0:7])`](https://github.com/\($repo)/pull/\($pr)/commits/\(.sha)) \(.commit.message | split("\n")[0])"
                    + (if .author.login == $author then "" elif .author.login then " by @\(.author.login)" else " by \(.commit.author.name)" end)'
            done
            if [[ -n "$prev" ]]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...v%s\n' "$GITHUB_REPOSITORY" "$prev" "$VERSION"
            fi
          } >"$notes"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --notes-file "$notes" bin/kit-"$VERSION"-* bin/kit-chat-"$VERSION".zip

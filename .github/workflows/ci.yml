name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # The version .tool-versions pins, script and binary both from its tag.
      - name: Install golangci-lint
        run: |
          v="v$(awk '$1 == "golangci-lint" {print $2}' ../.tool-versions)"
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/$v/install.sh" | sh -s -- -b "$(go env GOPATH)/bin" "$v"

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: vet
        run: go vet ./...

      # Logs only: deadcode exits 0 with findings.
      - name: deadcode
        run: go tool deadcode -test ./...

      # Before test: the launcher tests run the real shims, which need the
      # binary for this platform.
      - name: build
        run: ./build.sh

      - name: test
        run: go test ./...

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # The release workflow rejects a non-semver version after merge, when
      # installs already see it; catch it on the PR instead.
      - name: plugin version is semver
        run: jq -re .version .claude-plugin/plugin.json | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR bin/kit go/build.sh

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: claude plugin validate
        run: claude plugin validate .

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      # Before test: the launcher tests run the real shims, which need the
      # binary for this platform.
      - name: build
        run: ./build.sh

      - name: test
        run: go test ./...

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      # The release workflow rejects a non-semver version after merge, when
      # installs already see it; catch it on the PR instead.
      - name: plugin version is semver
        run: jq -re .version .claude-plugin/plugin.json | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR bin/doctor.sh bin/kit go/build.sh

      - name: bats
        run: bats tests/

      - name: doctor
        run: CI=true bash bin/doctor.sh

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: claude plugin validate
        run: claude plugin validate .

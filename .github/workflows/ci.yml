name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # The version .tool-versions pins, script and binary both from its tag.
      - name: Install golangci-lint
        run: |
          v="v$(awk '$1 == "golangci-lint" {print $2}' ../.tool-versions)"
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/$v/install.sh" | sh -s -- -b "$(go env GOPATH)/bin" "$v"

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: vet
        run: go vet ./...

      # deadcode exits 0 with findings, so any output fails the step.
      - name: deadcode
        run: |
          out="$(go tool deadcode -test ./...)"
          [ -z "$out" ] || { echo "$out"; exit 1; }

      # Before test: the launcher tests run the real shims, which need the
      # binary for this platform.
      - name: build
        run: ./build.sh

      # TestImportsGolden runs the import rules through ast-grep, and fails
      # without it under CI. The version .tool-versions pins, the one that
      # regenerated testdata/imports.golden; not in Dependabot.
      - name: Install ast-grep
        run: npm install -g "@ast-grep/cli@$(awk '$1 == "ast-grep" {print $2}' ../.tool-versions)"

      - name: test
        run: go test -race ./...

      # Not a Go test: go test caches past edits outside the module, and
      # skills/ and rules/ are outside it.
      - name: chat bundle
        working-directory: .
        run: KIT_DEV=1 bin/kit bundle chat --check

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A fresh install copies main's hooks.json under the current version and
      # downloads that version's released binary, so shipped Go or hook changes
      # without a bump pair new hooks with an old binary.
      - name: shipped change bumps the version
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --quiet "$BASE" HEAD -- go hooks/hooks.json mods ':!go/*_test.go' ':!go/*testdata*' ':!go/e2e' ':!go/build.sh' ':!mods/**/*.test.ts' && exit 0
          old="$(git show "$BASE:.claude-plugin/plugin.json" | jq -r .version)"
          [ "$old" != "$(jq -r .version .claude-plugin/plugin.json)" ] || { echo "go/, hooks/hooks.json, or mods/ changed; bump .claude-plugin/plugin.json version (still $old)"; exit 1; }

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # The release workflow rejects a non-semver version after merge, when
      # installs already see it; catch it on the PR instead.
      - name: plugin version is semver
        run: jq -re .version .claude-plugin/plugin.json | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR bin/kit go/build.sh templates/chat/scan.sh

      # Not in Dependabot: bump it by hand when a Claude Code release changes
      # what claude plugin validate checks.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.326

      # Validate reports a type error in mods/ as a warning, and --strict would
      # also fail on the root CLAUDE.md warning, so type errors are failed here.
      # A report of another shape fails too, so the filter can't pass by matching nothing.
      - name: claude plugin validate
        run: |
          out="$(claude plugin validate --json .)" || { echo "$out"; exit 1; }
          jq -e '.success == true and (.contents | type == "array") and all(.contents[]; .warnings | type == "array")' <<<"$out" >/dev/null ||
            { echo "claude plugin validate failed, or its --json report changed shape:"; echo "$out"; exit 1; }
          ts="$(jq -r '.contents[].warnings[].message | select(startswith("error TS"))' <<<"$out")"
          [ -z "$ts" ] || { echo "$ts"; exit 1; }

      # The style is mods/.prettierrc.json, the version mods/pnpm-lock.yaml.
      - name: Install pnpm
        run: npm install -g "$(jq -r .packageManager mods/package.json)"

      - name: Install mods dev tools
        working-directory: mods
        run: pnpm install --frozen-lockfile

      - name: prettier check mods
        working-directory: mods
        run: pnpm run format:check

      # claude plugin test runs only from a plugin root, and from this one it
      # would also run the codegraph fixture's main.test.ts, so it tests a copy.
      - name: claude plugin test
        run: |
          t="$(mktemp -d)"
          cp -R .claude-plugin hooks mods "$t"/
          claude plugin test "$t"
